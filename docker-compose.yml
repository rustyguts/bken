# Dev compose for bken (Nuxt edition).
#
# `docker compose up` starts two services:
#
#   nuxt   — Nuxt 4 dev server on :3000 (serves UI + JSON API + media routes)
#   cli    — Python 3.12 + CUDA torch + ffmpeg, used exclusively via
#            `docker compose exec cli uv run bken …` to run pipeline
#            stages (ingest, transcribe, events, score, clip, rank).
#
# Both services mount the same `./data` so they see the same SQLite DB and
# clip files. Open http://localhost:3000 for the admin panel.

name: bken

services:
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
      # BuildKit's attestations add minutes to `up --build` on large images
      # (the multi-GB cli image in particular stalls on "resolving provenance").
      # None of this is useful for local dev images.
      provenance: false
      sbom: false
    image: bken-app:dev
    ports:
      - "3000:3000"
    volumes:
      # Nuxt sources — hot reload. node_modules stays in the image so the
      # host doesn't need bun installed to `docker compose up`.
      - ./app/app:/app/app:rw
      - ./app/server:/app/server:rw
      - ./app/nuxt.config.ts:/app/nuxt.config.ts:ro
      - ./app/tsconfig.json:/app/tsconfig.json:ro
      # Shared data: SQLite DB + cached audio + cut clips + thumbnails.
      # Also holds `libraries/test` — sample clips auto-seeded as the
      # default library at startup (see BKEN_DEFAULT_LIBRARY).
      - ./data:/app/data:rw
      # Archive — source videos live here; mount read-only so the UI can stream them.
      - /mnt/shack:/mnt/shack:ro
    environment:
      BKEN_DATA: /app/data
      BKEN_DEFAULT_LIBRARY: /app/data/libraries/test
      # Prevents bun's port picker from hopping off 3000 when re-running.
      HOST: 0.0.0.0
    # Everything the UI does is SQL reads + ffmpeg-for-thumbs. No GPU needed.

  cli:
    build:
      context: ./cli
      dockerfile: Dockerfile
      provenance: false
      sbom: false
    image: bken-cli:dev
    # No ports — the app container enqueues work via the `job` table and this
    # worker process drains it. One-off commands still work via
    # `docker compose exec cli uv run bken <cmd>`.
    tty: true
    stdin_open: true
    command: ["uv", "run", "bken", "worker"]
    volumes:
      - ./cli/src:/app/src:rw
      - ./cli/pyproject.toml:/app/pyproject.toml:ro
      - ./data:/app/data:rw
      - ./models:/app/models:rw
      - ${ARCHIVE_DIR:-./.archive-stub}:/archive:ro
      - ${CLAUDE_HOME:-~/.claude}:/root/.claude:rw
    environment:
      PYTHONUNBUFFERED: "1"
      BKEN_DATA: /app/data
      BKEN_MODELS: /app/models
      PATH: /root/.claude/local:/usr/local/bin:/usr/bin:/bin
    # See docker-compose.gpu.yml for the nvidia-container-toolkit override.
