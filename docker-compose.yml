# Dev compose for bken (Go edition).
#
# `docker compose up` starts:
#
#   bken       — single Go binary on :3000. Serves UI + JSON API + media,
#                and runs the asynq worker in-process.
#   worker     — optional extra worker replica (profile: scale).
#   dragonfly  — asynq broker (Redis-compatible). DragonflyDB is a drop-in
#                Redis replacement with lower memory overhead and no AOF fsync
#                tax; asynq talks plain RESP so no code changes needed.
#   ollama     — local LLM runtime. Auto-pulls qwen2.5:1.5b-instruct on first
#                rank call (~1 GB on disk, ~1.5 GB RAM at inference).
#   whisper    — faster-whisper ASR HTTP service. `small` model by default
#                (~500 MB, CPU-usable). Override via ASR_MODEL env in .env.
#
# All services mount the same `./data` so SQLite + cached audio + clips stay
# consistent. Archive mount is read-only.

name: bken

services:
  bken:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    image: bken:dev
    depends_on:
      - dragonfly
      - ollama
      - whisper
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - .:/app:rw
      - ./data:/app/data:rw
      - ./models:/app/models:rw
      - /mnt/shack:/mnt/shack:ro
      - ${ARCHIVE_DIR:-./.archive-stub}:/archive:ro
    environment:
      BKEN_DATA: /app/data
      BKEN_MODELS: /app/models
      BKEN_HTTP: :3000
      BKEN_REDIS: dragonfly:6379
      BKEN_LLM_BASE_URL: http://ollama:11434
      BKEN_LLM_MODEL: qwen2.5:1.5b-instruct
      BKEN_ASR_BASE_URL: http://whisper:9000
      BKEN_ASR_LANGUAGE: en

  worker:
    image: bken:dev
    depends_on:
      - bken
      - dragonfly
      - ollama
      - whisper
    restart: unless-stopped
    volumes:
      - ./data:/app/data:rw
      - ./models:/app/models:rw
      - /mnt/shack:/mnt/shack:ro
      - ${ARCHIVE_DIR:-./.archive-stub}:/archive:ro
    environment:
      BKEN_DATA: /app/data
      BKEN_MODELS: /app/models
      BKEN_REDIS: dragonfly:6379
      BKEN_LLM_BASE_URL: http://ollama:11434
      BKEN_LLM_MODEL: qwen2.5:1.5b-instruct
      BKEN_ASR_BASE_URL: http://whisper:9000
      BKEN_ASR_LANGUAGE: en
    command: ["worker", "--concurrency", "2"]
    profiles: ["scale"]

  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
    restart: unless-stopped
    ulimits:
      memlock: -1
    volumes:
      - ./data/dragonfly:/data
    # `default_lua_flags=allow-undeclared-keys` is required for asynq — its
    # Lua scripts access keys computed at runtime, which Dragonfly's sandbox
    # rejects by default.
    command:
      - "--logtostderr"
      - "--dir=/data"
      - "--snapshot_cron=*/15 * * * *"
      - "--default_lua_flags=allow-undeclared-keys"

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ./data/ollama:/root/.ollama
    # CPU-only by default. For GPU acceleration see docker-compose.gpu.yml.
    environment:
      OLLAMA_KEEP_ALIVE: "30m"
      OLLAMA_MAX_LOADED_MODELS: "1"

  whisper:
    # faster-whisper HTTP service. `small` model downloads on first boot
    # (~500 MB cached under ./data/whisper). Override with ASR_MODEL in .env
    # for base/medium/large-v3. CPU by default; GPU image is the
    # `onerahmet/openai-whisper-asr-webservice:latest-gpu` tag.
    image: onerahmet/openai-whisper-asr-webservice:latest
    restart: unless-stopped
    environment:
      ASR_MODEL: ${ASR_MODEL:-large-v3-turbo}
      ASR_ENGINE: faster_whisper
      # Cache downloaded weights on the host so restarts are instant.
      HF_HUB_CACHE: /root/.cache/huggingface
    volumes:
      - ./data/whisper:/root/.cache
