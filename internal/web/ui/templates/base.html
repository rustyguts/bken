{{define "base"}}<!DOCTYPE html>
<html lang="en" data-theme="night">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{.Title}} — bken</title>
  <link rel="stylesheet" href="/static/dist/app.css">
  <script type="module" src="https://cdn.jsdelivr.net/gh/starfederation/datastar@v1.0.0-beta.11/bundles/datastar.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="min-h-screen bg-base-200 text-base-content font-sans">
  <div class="drawer lg:drawer-open">
    <input id="nav-drawer" type="checkbox" class="drawer-toggle">
    <div class="drawer-content flex flex-col min-h-screen">
      <header class="navbar bg-base-100 border-b border-base-300 px-4">
        <div class="flex-none lg:hidden">
          <label for="nav-drawer" class="btn btn-square btn-ghost" aria-label="Open navigation">
            <i data-lucide="menu" class="w-5 h-5"></i>
          </label>
        </div>
        <div class="flex-1">
          <a href="/" class="text-xl font-bold tracking-wide uppercase text-primary">bken</a>
          <span class="ml-3 text-sm text-base-content/60">{{.Heading}}</span>
        </div>
        <div class="flex-none gap-2">
          {{block "header_actions" .}}{{end}}
        </div>
      </header>
      <main class="flex-1 p-4 lg:p-6">
        {{block "page" .}}{{end}}
      </main>
    </div>
    <aside class="drawer-side z-40">
      <label for="nav-drawer" aria-label="Close navigation" class="drawer-overlay"></label>
      <nav class="menu bg-base-100 border-r border-base-300 min-h-full w-56 p-4 gap-1">
        <li class="menu-title text-xs uppercase tracking-widest text-base-content/50">Pipeline</li>
        <li><a href="/" class="{{if eq .Nav "dashboard"}}menu-active{{end}}"><i data-lucide="film" class="w-4 h-4"></i> Assets</a></li>
        <li><a href="/libraries" class="{{if eq .Nav "libraries"}}menu-active{{end}}"><i data-lucide="library" class="w-4 h-4"></i> Libraries</a></li>
        <li><a href="/jobs" class="{{if eq .Nav "jobs"}}menu-active{{end}}"><i data-lucide="activity" class="w-4 h-4"></i> Jobs</a></li>
      </nav>
    </aside>
  </div>
  <script>
    lucide.createIcons();
  </script>
</body>
</html>
{{end}}
