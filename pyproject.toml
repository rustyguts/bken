[project]
name = "vidpipe"
version = "0.1.0"
description = "Gaming video funny-moment extraction pipeline"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Core
    "typer>=0.12",
    "rich>=13",
    "numpy>=1.26",
    "tqdm>=4.66",
    # Video/audio
    "ffmpeg-python>=0.2",
    # ASR
    "faster-whisper>=1.1",
    # Audio events: PANNs (via panns-inference) - laughter, shouting, cheering, etc.
    "panns-inference>=0.1.1",
    "librosa>=0.10",
    "soundfile>=0.12",
    # LLM ranking shells out to the `claude` CLI (Claude Code) — no API
    # key needed, uses the user's existing Claude subscription auth.
    # Torch with CUDA (installed from index below)
    "torch>=2.4",
    "torchaudio>=2.4",
    # Vision (Florence-2 + PyAV + scene detection)
    "av>=12",
    "scenedetect>=0.6.5",
    "opencv-python-headless>=4.10",
    "transformers>=4.45",
    "pillow>=10",
    "einops>=0.8",
    "timm>=1.0",
    # FastAPI/uvicorn removed with the Nuxt rewrite — the web UI now lives
    # in `nuxt/` and talks to SQLite / ffmpeg directly from server routes.
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
vidpipe = "vidpipe.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vidpipe"]

[tool.uv]
# faster-whisper brings ctranslate2; torch comes from pytorch CUDA index
[tool.uv.sources]
torch = [{ index = "pytorch-cu124" }]
torchaudio = [{ index = "pytorch-cu124" }]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
